<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/src/main.js" defer type="module"></script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Tasks Vanilla</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-content">
        <div class="logo" >📝 MyTasks </div>
        <ul class="nav-links">
          <li><a class = "nav-link" href="/Home">Home</a></li>
          <li><a class = "nav-link" href="/Tasks">Tasks</a></li>
          <li><a class = "nav-link" href="/Loging">Login</a></li>
        </ul>
      </div>
    </nav>
    <div class="app-container">
      <div class="task-app">
        <div class="header">
          <h1>Tasks</h1>
          <button class="options-btn">⋮</button>
        </div>
        <form id="add-task-form" class="add-task-form">
          <label>
            <input id="new-task-input" type="text" placeholder="Add a task..." />

          <button type="submit">+</button>

        <ul id="task-list" class="task-list"></ul>
      </div>
    </div>
  </body>
</html>
